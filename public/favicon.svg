<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Full-bleed background, deliberately NOT rounded like ranobe-db / manga-db / game-db: rounded
       corners leave the four corners transparent, which some browsers and icon pipelines
       composite onto white. A square fill keeps the corners black everywhere — the same choice
       mystery-db made. -->
  <rect width="64" height="64" fill="#000000" />
  <!-- 技 is a dense kanji rather than the kana the sister sites use, so it's set slightly smaller
       than their 46px and centred with dominant-baseline. Kept in sync with
       scripts/generate-icons.mjs, which renders favicon.ico and apple-touch-icon.png. -->
  <text
    x="32"
    y="33"
    font-family="'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'IPAGothic', sans-serif"
    font-weight="800"
    font-size="42"
    fill="#71e6d3"
    text-anchor="middle"
    dominant-baseline="central"
  >技</text>
</svg>
